name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # Вшивается в бинарник через option_env!("ELITE_VERSION") в cli.rs.
      ELITE_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: elite
            # PipeWire остаётся основным бэкендом, cpal/ALSA — фоллбек.
            features: --features audio-cpal
            cache-key: linux-pipewire-alsa
            archive: elite-${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: elite.exe
            features: ''
            cache-key: windows
            archive: elite-${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache-key }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libclang-dev libasound2-dev pkg-config
          # В .cargo/config.toml зашиты пути clang/gcc хоста разработчика;
          # на раннере они мешают bindgen. Cargo не перезаписывает уже
          # заданную переменную окружения, если force = true не указано.
          echo "BINDGEN_EXTRA_CLANG_ARGS=" >> "$GITHUB_ENV"

      - name: Tests
        shell: bash
        run: |
          python tools/make_kladov_image.py
          cargo test --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Check embedded version
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          version="$(./"$binary" --version)"
          test "$version" = "elite $ELITE_VERSION"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.archive }}" -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          args=(--title "$TAG" --generate-notes)
          # Стабильный релиз — только vX.Y.Z; v0.1.0alpha, v0.1.0-beta.1
          # и прочие варианты публикуются как pre-release.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
