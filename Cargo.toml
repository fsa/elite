[package]
name = "elite"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
rfd = "0.17.2"
# Оконный слой — только нативный Wayland.  Клавиши берём как `physical_key`
# (код позиции клавиши), поэтому раскладка на ввод не влияет.  `wayland-dlopen`
# открывает libwayland-client динамически — dev-заголовки при сборке не нужны.
winit = { version = "0.30", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
    "rwh_06",
] }
# Показ кадра 256x192 (буфер u32) средствами Wayland shm.
softbuffer = { version = "0.4", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
] }
