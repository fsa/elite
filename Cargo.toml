[package]
name = "elite"
version = "0.1.0"
edition = "2024"

[features]
# Аудиобэкенд выбирается платформой: на Linux по умолчанию PipeWire, на macOS
# и Windows — cpal. Для явного выбора:
#   cargo build --no-default-features --features audio-pipewire  — только PipeWire (Linux)
#   cargo build --no-default-features --features audio-cpal      — только cpal
default = ["audio-pipewire"]
audio-pipewire = ["dep:pipewire"]
audio-cpal = ["dep:cpal"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Стандартные пользовательские каталоги (data_dir) с явными вендором FSA и
# приложением Elite: путь не зависит от текущего рабочего каталога.
dirs = "7"
rfd = "0.17.2"
# Кросс-платформенный бэкенд на Linux при явном выборе `audio-cpal` (ALSA).
cpal = { version = "0.18", optional = true }
# Оконный слой — только нативный Wayland.  Клавиши берём как `physical_key`
# (код позиции клавиши), поэтому раскладка на ввод не влияет.  `wayland-dlopen`
# открывает libwayland-client динамически — dev-заголовки при сборке не нужны.
winit = { version = "0.30", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita",
    "rwh_06",
] }
# Показ кадра 256x192 (буфер u32) средствами Wayland shm.
softbuffer = { version = "0.4", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
# Кросс-платформенный бэкенд по умолчанию на macOS/Windows (CoreAudio/WASAPI).
cpal_platform = { package = "cpal", version = "0.18" }

[target.'cfg(target_os = "linux")'.dependencies]
# Нативный PipeWire, аудиосистема по умолчанию на Linux.
pipewire = { version = "0.10", features = ["v0_3_49"], optional = true }
