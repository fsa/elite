[package]
name = "elite"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# minifb собираем только с backend-ом X11: Wayland-версия распознаёт клавиши по
# активной раскладке, поэтому при включённой русской раскладке буквы приходят
# кириллическими и теряются.  В X11-версии используется core-раскладка (группа
# 0), а позиции клавиш мы дополнительно считываем напрямую (`PhysicalKeys`).
#
# `dlopen` включаем отдельно (хотя сам Wayland-backend minifb выключен): через
# объединение фич он оставляет `wayland-sys` в режиме dlopen, а Wayland в дерево
# зависимостей всё равно тянет `rfd` (диалог выбора файла).  Без этого сборка
# потребовала бы установленных wayland-client dev-заголовков.
minifb = { version = "0.29.0", default-features = false, features = ["x11", "dlopen"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
rfd = "0.17.2"
# Прямой доступ к X11 нужен, чтобы читать физические позиции клавиш
# (`XQueryKeymap`) независимо от текущей раскладки.
x11-dl = "2"
